    <!-- FontAwesome Vector Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">

    <style>
        :root {
            --amfm-bg: #070b14;
            --amfm-surface: rgba(10, 16, 28, 0.88);
            --amfm-border: rgba(255, 255, 255, 0.12);
            --amfm-border-focus: #00d2ff;
            --amfm-accent: #00d2ff;
            --amfm-accent-hover: #38bdf8;
            --amfm-text: #f8fafc;
            --amfm-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--amfm-bg);
            color: var(--amfm-text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        [data-amfm-app] {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Viewport Cartographique Multi-Canvas */
        .amfm-viewport {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #070b14;
            cursor: grab;
            touch-action: none;
            outline: none;
        }
        .amfm-viewport:active { cursor: grabbing; }

        .amfm-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Header Supérieur : Barre Unique Ultra-Compacte (~48 px) */
        .amfm-header {
            position: absolute;
            top: max(10px, env(safe-area-inset-top));
            left: max(12px, env(safe-area-inset-left));
            right: max(12px, env(safe-area-inset-right));
            z-index: 100;
            pointer-events: none;
        }

        .amfm-navbar {
            pointer-events: auto;
            background: var(--amfm-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--amfm-border);
            border-radius: 12px;
            padding: 5px 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 48px;
        }

        /* Bloc Gauche : Marque + Modèle + Commune */
        .amfm-nav-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .amfm-logo {
            height: 24px;
            width: auto;
            display: block;
        }
        .amfm-title-text {
            font-size: 13.5px;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        .amfm-badge {
            background: linear-gradient(135deg, #00d2ff, #0284c7);
            color: #070b14 !important;
            font-size: 10.5px;
            font-weight: 900;
            padding: 2px 7px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* Bloc Centre : Sélecteurs de Calque et Région */
        .amfm-nav-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            max-width: 620px;
            justify-content: center;
        }

        /* Bloc Droite : Exports + Outils + Échéance */
        .amfm-nav-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .amfm-headline {
            font-size: 12px;
            font-weight: 700;
            color: var(--amfm-accent);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.25);
            padding: 4px 10px;
            border-radius: 8px;
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .amfm-headline .amfm-headline-layer {
            color: var(--amfm-muted);
            font-weight: 600;
        }

        /* Sélecteurs stylisés compacts */
        select {
            background: rgba(14, 23, 40, 0.95);
            border: 1px solid var(--amfm-border);
            color: #fff;
            font-size: 12.5px;
            font-weight: 700;
            padding: 0 10px;
            border-radius: 8px;
            height: 36px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2338bdf8' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 10px center;
            padding-right: 28px;
        }
        select:hover, select:focus-visible {
            border-color: var(--amfm-border-focus);
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
        }
        select option {
            background: #0e1728;
            color: #fff;
        }
        select option:checked {
            background: #1a3a6e;
            color: #38bdf8;
        }

        .amfm-select-layer {
            flex: 1.2;
            min-width: 170px;
        }
        .amfm-select-model {
            flex: 0.9;
            min-width: 150px;
            background: rgba(0, 119, 255, 0.18);
            border-color: rgba(0, 119, 255, 0.55);
            font-weight: 800;
        }
        .amfm-select-region {
            flex: 0.8;
            min-width: 130px;
        }
        .amfm-select-sea {
            flex: 0.8;
            min-width: 140px;
        }

        /* Boutons d'Action compacts */
        .amfm-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--amfm-border);
            color: #fff;
            padding: 0 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            height: 36px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            white-space: nowrap;
            text-decoration: none;
        }
        .amfm-btn:hover, .amfm-btn:focus-visible {
            background: rgba(0, 210, 255, 0.22);
            border-color: var(--amfm-accent);
            outline: 2px solid var(--amfm-border-focus);
            outline-offset: 1px;
        }
        .amfm-btn:active { transform: scale(0.96); }

        .amfm-btn-icon {
            width: 36px;
            padding: 0;
        }
        .amfm-btn.is-active {
            background: rgba(0, 210, 255, 0.2);
            border-color: var(--amfm-accent);
            color: var(--amfm-accent-hover);
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.3) inset;
        }

        .amfm-btn-commune {
            background: rgba(56, 189, 248, 0.14);
            border-color: rgba(56, 189, 248, 0.35);
            color: #38bdf8;
        }
        .amfm-btn-commune:hover {
            background: #0284c7;
            color: #fff;
        }

        .amfm-btn-download {
            background: linear-gradient(135deg, #0284c7, #0369a1) !important;
            color: #fff !important;
            font-weight: 800 !important;
            border: 1px solid rgba(0, 210, 255, 0.35);
            padding: 0 9px;
        }
        .amfm-btn-download:hover {
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
            transform: translateY(-1px);
        }

        .amfm-btn-group {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* Légende Météorologique Compacte Pro */
        .amfm-legend {
            position: absolute;
            left: max(14px, env(safe-area-inset-left));
            bottom: calc(max(10px, env(safe-area-inset-bottom)) + 58px);
            z-index: 100;
            background: var(--amfm-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--amfm-border);
            border-radius: 10px;
            padding: 8px 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            width: 220px;
            pointer-events: none;
        }
        .amfm-legend-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 5px;
            color: #fff;
            letter-spacing: 0.2px;
        }
        .amfm-legend-header [data-amfm-legend-unit] {
            color: var(--amfm-accent);
            font-size: 12px;
            font-weight: 900;
        }
        .amfm-legend-bar {
            height: 10px;
            border-radius: 5px;
            background: linear-gradient(to right, #482173, #3478c5, #55b7dd, #70cf66, #f2d43d, #ea652b, #d93435, #5b1037);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
        }
        .amfm-legend-ticks {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 700;
            color: var(--amfm-muted);
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }

        /* Timeline Inférieure Compacte (~48 px) */
        .amfm-timeline {
            position: absolute;
            bottom: max(10px, env(safe-area-inset-bottom));
            left: max(12px, env(safe-area-inset-left));
            right: max(12px, env(safe-area-inset-right));
            z-index: 100;
            background: var(--amfm-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--amfm-border);
            border-radius: 12px;
            padding: 6px 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 14px;
            min-height: 48px;
        }

        .amfm-player {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .amfm-player button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--amfm-border);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .amfm-player button:hover, .amfm-player button:focus-visible {
            background: #0284c7;
            border-color: var(--amfm-accent);
            outline: 2px solid var(--amfm-border-focus);
            outline-offset: 1px;
        }
        .amfm-player button:active { transform: scale(0.94); }

        .amfm-slider-track {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .amfm-info-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 800;
        }
        .amfm-validity {
            color: var(--amfm-accent);
            font-variant-numeric: tabular-nums;
        }
        .amfm-lead {
            background: rgba(0, 210, 255, 0.18);
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 1px 7px;
            border-radius: 5px;
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }

        /* Style Slider */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.16);
            outline: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        input[type="range"]:hover {
            background: rgba(255, 255, 255, 0.26);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--amfm-accent);
            box-shadow: 0 0 10px var(--amfm-accent), 0 2px 4px rgba(0,0,0,0.6);
            border: 2px solid #ffffff;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 0 14px #38bdf8;
        }
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--amfm-accent);
            box-shadow: 0 0 10px var(--amfm-accent);
            border: 2px solid #ffffff;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-track {
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.16);
        }

        /* Sonde de Pixel */
        .amfm-probe {
            position: fixed;
            z-index: 1500;
            pointer-events: none;
            background: rgba(8, 12, 20, 0.95);
            border: 1px solid var(--amfm-accent);
            border-radius: 8px;
            padding: 5px 10px;
            display: none;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8);
        }
        .amfm-probe.active { display: block; }
        .amfm-probe-pinned {
            display: flex !important;
            flex-direction: column;
            gap: 2px;
            position: absolute;
            z-index: 1500;
            pointer-events: auto;
            background: rgba(8, 12, 20, 0.96);
            border: 1px solid var(--amfm-accent);
            border-radius: 8px;
            padding: 5px 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8);
        }
        .amfm-probe-pin-close {
            position: absolute;
            top: 2px;
            right: 6px;
            background: none;
            border: none;
            color: var(--amfm-muted);
            font-size: 14px;
            cursor: pointer;
            padding: 2px 4px;
        }
        .amfm-probe-pin-close:hover { color: #fff; }
        .amfm-probe-val {
            font-size: 14px;
            font-weight: 800;
            color: var(--amfm-accent);
            font-variant-numeric: tabular-nums;
        }
        .amfm-probe-label { font-size: 10.5px; color: var(--amfm-muted); }

        /* Modal de Personnalisation GIF */
        .amfm-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(4, 7, 13, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: amfmFadeIn 0.2s ease-out;
        }
        .amfm-modal-overlay[hidden] { display: none !important; }
        @keyframes amfmFadeIn { from { opacity: 0; } to { opacity: 1; } }
        .amfm-modal-box {
            background: rgba(11, 18, 32, 0.96);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            padding: 22px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 210, 255, 0.15);
            color: #fff;
        }
        .amfm-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }
        .amfm-modal-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--amfm-accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .amfm-modal-close {
            background: none;
            border: none;
            color: var(--amfm-muted);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
        }
        .amfm-modal-close:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
        .amfm-form-group {
            margin-bottom: 14px;
        }
        .amfm-form-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--amfm-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .amfm-radio-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .amfm-radio-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s ease;
        }
        .amfm-radio-card:hover {
            background: rgba(0, 210, 255, 0.08);
            border-color: rgba(0, 210, 255, 0.3);
        }
        .amfm-radio-card input[type="radio"] {
            accent-color: var(--amfm-accent);
            cursor: pointer;
        }
        .amfm-range-custom {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            padding-left: 26px;
        }
        .amfm-select-mini {
            background: rgba(7, 11, 20, 0.9);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 6px;
            color: #fff;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 600;
        }
        .amfm-modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .amfm-btn-generate-gif {
            flex: 1;
            background: linear-gradient(135deg, #0099ff, #00d2ff);
            color: #070b14;
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
            transition: transform 0.15s ease;
        }
        .amfm-btn-generate-gif:hover { transform: translateY(-1px); }
        .amfm-btn-generate-gif:disabled { opacity: 0.6; cursor: not-allowed; }
        .amfm-progress-container {
            margin-top: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 10px;
            border: 1px solid rgba(0, 210, 255, 0.2);
        }
        .amfm-progress-bar-bg {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
        }
        .amfm-progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0099ff, #00d2ff);
            border-radius: 4px;
            transition: width 0.15s ease;
        }
        .amfm-progress-text {
            font-size: 12px;
            font-weight: 700;
            color: var(--amfm-accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .amfm-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(7, 11, 20, 0.92);
            border: 1px solid var(--amfm-accent);
            padding: 14px 24px;
            border-radius: 12px;
            color: var(--amfm-accent);
            font-size: 13.5px;
            font-weight: 700;
            z-index: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            pointer-events: none;
        }
        .amfm-error {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(220, 38, 38, 0.92);
            border: 1px solid #ef4444;
            padding: 10px 20px;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            z-index: 600;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            max-width: 90%;
            text-align: center;
        }
        .amfm-loading[hidden], .amfm-error[hidden] {
            display: none !important;
        }

        /* 📱 RESPONSIVE */
        @media (max-width: 1024px) {
            .amfm-navbar {
                flex-wrap: wrap;
                gap: 8px;
                padding: 8px 10px;
            }
            .amfm-nav-controls {
                order: 3;
                width: 100%;
                max-width: 100%;
            }
            .amfm-headline { display: none; }
        }
        @media (max-width: 650px) {
            .amfm-btn-download span,
            .amfm-btn-commune span {
                display: none;
            }
            .amfm-title-text { display: none; }
            .amfm-legend {
                bottom: calc(max(10px, env(safe-area-inset-bottom)) + 60px);
                width: 180px;
                padding: 6px 10px;
            }
        }
        @media (max-height: 500px) and (orientation: landscape) {
            .amfm-legend { display: none; }
            .amfm-header { top: 4px; }
            .amfm-timeline { bottom: 4px; }
        }
    </style>
</head>
<body>
    <div data-amfm-app
         data-base-url="output/gfs"
         data-model="gfs"
         data-logo="logo.png"
         data-variable="geopotentiel_500"
         data-timezone="Europe/Paris"
         data-animation="1">
        
        <!-- Header Supérieur : Barre Unique Ultra-Compacte (~48 px) -->
        <header class="amfm-header" role="banner">
            <div class="amfm-navbar" role="region" aria-label="Contrôles de la carte">
                <!-- Gauche : Marque + Modèle + Commune -->
                <div class="amfm-nav-brand">
                    <img src="logo.png" alt="Météo-Climat Pro" class="amfm-logo" aria-hidden="false">
                    <span class="amfm-title-text">GFS 0.25°</span>
                    <span class="amfm-badge">Europe</span>
                </div>

                <!-- Centre : Sélecteur de Calque Météo + Sélecteur de Région -->
                <div class="amfm-nav-controls">
                    <!-- Sélecteur de Modèle (GFS / ARPEGE, Europe / France) -->
                    <select id="select-model" class="amfm-select-model" aria-label="Sélection du modèle de prévision">
                        <option value="gfs" selected>🌍 GFS Europe (0,25°)</option>
                        <option value="gfs_france">🇫🇷 GFS France (0,25°)</option>
                        <option value="arpege">🇪🇺 ARPEGE Europe (0,1°)</option>
                        <option value="arpege_france">🇫🇷 ARPEGE France (0,1°)</option>
                        <option value="icon_eu_france">🇫🇷 ICON-EU France (7 km)</option>
                        <option value="aifs">🤖 ECMWF AIFS Europe (0,25°)</option>
                        <option value="aifs_france">🇫🇷 ECMWF AIFS France (0,25°)</option>
                    </select>

                    <!-- Sélecteur direct de Calque Météo -->
                    <select id="direct-layer-select" class="amfm-select-layer" aria-label="Sélection du paramètre météorologique">
                        <optgroup label="🗺️ Synoptique & Altitude">
                            <option value="geopotentiel_500" selected>🗺️ Géop. Z500 & Pression au sol (dam/hPa)</option>
                            <option value="temperature_850">🌡️ Température à 850 hPa (~1 500 m)</option>
                            <option value="pression">🧭 Pression niveau mer (hPa)</option>
                        </optgroup>
                        <optgroup label="🌡️ Températures">
                            <option value="temperature">🌡️ Température à 2 m (°C)</option>
                            <option value="temperature_ressentie">❄️ Température ressentie (°C)</option>
                            <option value="point_rosee">💧 Point de rosée (°C)</option>
                            <option value="humidex">🔥 Indice Humidex</option>
                        </optgroup>
                        <optgroup label="🌧️ Précipitations & Pluie">
                            <option value="pluie_1h">🌧️ Précipitations 3h (mm)</option>
                            <option value="pluie_cumul">📊 Précipitations cumulées (mm)</option>
                        </optgroup>
                        <optgroup label="💨 Vent & Tempêtes">
                            <option value="vent">💨 Vent moyen à 10 m (km/h)</option>
                            <option value="rafales">⚡ Rafales maximales (km/h)</option>
                            <option value="rafales_cumul">🌪️ Rafales max cumulées (km/h)</option>
                        </optgroup>
                        <optgroup label="☁️ Nuages & Ciel">
                            <option value="nebulosite">☁️ Nébulosité totale (%)</option>
                            <option value="nuages_bas">🌫️ Nuages bas / Brouillard (%)</option>
                            <option value="nuages_moyens">⛅ Nuages moyens (%)</option>
                            <option value="nuages_eleves">🌤️ Nuages élevés (%)</option>
                            <option value="humidite">💧 Humidité relative (%)</option>
                        </optgroup>
                        <optgroup label="⚡ Orages & Instabilité">
                            <option value="mucape">⚡ Instabilité MUCAPE (J/kg)</option>
                        </optgroup>
                        <optgroup label="❄️ Hiver & Neige">
                            <option value="neige_au_sol">🏔️ Épaisseur neige au sol (cm)</option>
                        </optgroup>
                    </select>

                    <!-- Style des contours Z500 (Synoptique / Détaillé), visible sur la couche Z500 -->
                    <select id="z500-style" class="amfm-select-layer" style="display:none;" aria-label="Style des contours Z500">
                        <option value="geopotentiel_500">🎛️ Synoptique (isobares 5 hPa)</option>
                        <option value="geopotentiel_500_meteociel">🎛️ Détaillé (isobares 1 hPa)</option>
                    </select>

                    <!-- Sélecteur de Zone (Europe / France / Régions) -->
                    <select id="select-region" data-amfm-region-select class="amfm-select-region" aria-label="Zoomer sur une zone géographique">
                        <option value="europe" selected>🇪🇺 Europe Entière</option>
                        <option value="france">🇫🇷 France Entière</option>
                        <option value="hdf">🏘️ Hauts-de-France</option>
                        <option value="normandie">🍏 Normandie</option>
                        <option value="idf">🗼 Île-de-France</option>
                        <option value="grandest">🥨 Grand Est</option>
                        <option value="bretagne">⛵ Bretagne</option>
                        <option value="pdl">⚓ Pays de la Loire</option>
                        <option value="cvl">🏰 Centre-Val de Loire</option>
                        <option value="bfc">🍇 Bourgogne-Franche-Comté</option>
                        <option value="naq">🌊 Nouvelle-Aquitaine</option>
                        <option value="ara">⛰️ Auvergne-Rhône-Alpes</option>
                        <option value="occitanie">🌞 Occitanie</option>
                        <option value="paca">☀️ PACA</option>
                        <option value="corse">🏝️ Corse</option>
                        <option value="belgique">🇧🇪 Belgique</option>
                        <option value="uk">🇬🇧 Royaume-Uni & Irlande</option>
                        <option value="allemagne">🇩🇪 Allemagne & Benelux</option>
                        <option value="espagne">🇪🇸 Espagne & Portugal</option>
                        <option value="italie">🇮🇹 Italie & Méditerranée</option>
                    </select>
                </div>

                <!-- Droite : Exports + Outils + Échéance -->
                <div class="amfm-nav-actions">
                    <div class="amfm-btn-group">
                        <button type="button" class="amfm-btn amfm-btn-download" data-amfm-capture aria-label="Télécharger en PNG 4:3" title="Télécharger la carte en PNG HD (4:3 Standard)">
                            <i class="fa-solid fa-download" aria-hidden="true"></i> <span>PNG</span>
                        </button>
                        <button type="button" class="amfm-btn amfm-btn-download" data-amfm-capture-screen aria-label="Capture d'écran HD fidèle" title="Télécharger la Capture d'Écran HD exacte (reproduction 100% fidèle au cadrage actuel)">
                            <i class="fa-solid fa-camera" aria-hidden="true"></i> <span>Écran</span>
                        </button>
                        <button type="button" class="amfm-btn amfm-btn-download" data-amfm-capture-jpeg aria-label="Télécharger en JPEG" title="Télécharger en JPEG">
                            <i class="fa-solid fa-image" aria-hidden="true"></i> <span>JPEG</span>
                        </button>
                        <button type="button" class="amfm-btn amfm-btn-download" data-amfm-capture-gif aria-label="Télécharger l'animation GIF" title="Télécharger le GIF animé">
                            <i class="fa-solid fa-film" aria-hidden="true"></i> <span>GIF</span>
                        </button>
                    </div>

                    <button type="button" class="amfm-btn amfm-btn-icon" data-amfm-reset aria-label="Recentrer la carte météo" title="Recentrer sur la France">
                        <i class="fa-solid fa-location-crosshairs" aria-hidden="true"></i>
                    </button>

                    <button type="button" class="amfm-btn amfm-btn-icon is-active" data-amfm-toggle-cities aria-pressed="true" aria-label="Afficher ou masquer les villes" title="Afficher/Masquer les villes">
                        <i class="fa-solid fa-city" aria-hidden="true"></i>
                    </button>

                    <button type="button" class="amfm-btn amfm-btn-icon" data-amfm-toggle-values aria-pressed="false" aria-label="Afficher ou masquer la grille de valeurs météo" title="Afficher/Masquer les valeurs météo sur la carte">
                        <i class="fa-solid fa-hashtag" aria-hidden="true"></i>
                    </button>

                    <!-- Sélecteur Mode Terre / Mer -->
                    <select class="amfm-select-sea" data-amfm-select-sea aria-label="Filtrer l'affichage des valeurs en mer et littoral" title="Zone d'affichage des valeurs météo">
                        <option value="none" selected>🌊 Partout (Mer comprise)</option>
                        <option value="land">🌲 Terres seules</option>
                        <option value="coast">🏖️ Terres + Bord de mer</option>
                    </select>

                    <div class="amfm-headline" data-amfm-headline aria-live="polite">
                        <span class="amfm-headline-layer">Température à 2 m (°C) — </span>Chargement…
                    </div>
                </div>
            </div>
        </header>

        <!-- Viewport Cartographique Multi-Canvas -->
        <main class="amfm-viewport" data-amfm-viewport tabindex="0" role="main" aria-label="Carte interactive de prévisions météo GFS & ARPEGE (Touches +/- pour zoomer, flèches pour naviguer)">
            <canvas class="amfm-canvas" data-amfm-weather aria-hidden="true"></canvas>
            <canvas class="amfm-canvas" data-amfm-vectors aria-hidden="true"></canvas>
            <canvas class="amfm-canvas" data-amfm-values aria-hidden="true"></canvas>
            <canvas class="amfm-canvas" data-amfm-labels aria-hidden="true"></canvas>
            <!-- Indicateur de Chargement -->
            <div class="amfm-loading" data-amfm-loading hidden>
                <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> <span>Chargement des données météo…</span>
            </div>
            <!-- Boîte d'Alerte / Erreur Réseau -->
            <div class="amfm-error" data-amfm-error hidden role="alert"></div>
        </main>

        <!-- Sonde de Pixel -->
        <div class="amfm-probe" data-amfm-probe role="status">
            <div class="amfm-probe-val" data-amfm-probe-value>—</div>
            <div class="amfm-probe-label" data-amfm-probe-label>Température</div>
        </div>

        <!-- Légende Dynamique avec Ticks -->
        <aside class="amfm-legend" data-amfm-legend role="complementary" aria-label="Échelle colorimétrique de la carte">
            <div class="amfm-legend-header">
                <span data-amfm-legend-label>Échelle</span>
                <span data-amfm-legend-unit>°C</span>
            </div>
            <div class="amfm-legend-bar" data-amfm-legend-bar></div>
            <div class="amfm-legend-ticks" data-amfm-legend-ticks>
                <span>-15°</span><span>0°</span><span>15°</span><span>30°</span><span>45°</span>
            </div>
        </aside>

        <!-- Timeline Inférieure Compacte -->
        <footer class="amfm-timeline" role="region" aria-label="Contrôle de la timeline et des échéances de prévision">
            <div class="amfm-player">
                <button type="button" data-amfm-previous aria-label="Échéance horaire précédente" title="Échéance précédente">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button type="button" data-amfm-play aria-label="Lancer la lecture automatique de l'animation" title="Lecture / Pause">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button type="button" data-amfm-next aria-label="Échéance horaire suivante" title="Échéance suivante">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>

            <div class="amfm-slider-track">
                <div class="amfm-info-row">
                    <span class="amfm-validity" data-amfm-validity aria-live="polite">Chargement…</span>
                    <span class="amfm-lead" data-amfm-lead>H+00</span>
                </div>
                <input type="range" data-amfm-slider min="0" max="24" value="0" step="1" aria-label="Curseur d'échéance temporelle" aria-valuetext="H+00">
            </div>
        </footer>

        <!-- Modal de Personnalisation GIF -->
        <div class="amfm-modal-overlay" data-amfm-gif-modal hidden>
            <div class="amfm-modal-box" role="dialog" aria-modal="true" aria-labelledby="amfm-gif-title">
                <div class="amfm-modal-header">
                    <div class="amfm-modal-title" id="amfm-gif-title">
                        <i class="fa-solid fa-film"></i> Exporter l'Animation GIF
                    </div>
                    <button type="button" class="amfm-modal-close" data-amfm-gif-close aria-label="Fermer">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="amfm-form-group">
                    <label class="amfm-form-label">Plage d'échéances à inclure</label>
                    <div class="amfm-radio-group">
                        <label class="amfm-radio-card">
                            <input type="radio" name="gif-range" value="all" checked>
                            <span><strong>Tout le run</strong> (toutes les échéances)</span>
                        </label>
                        <label class="amfm-radio-card">
                            <input type="radio" name="gif-range" value="24h">
                            <span><strong>Prochaines 24h</strong> (H+01 → H+24)</span>
                        </label>
                        <label class="amfm-radio-card">
                            <input type="radio" name="gif-range" value="48h">
                            <span><strong>Prochaines 48h</strong> (H+01 → H+48)</span>
                        </label>
                        <label class="amfm-radio-card">
                            <input type="radio" name="gif-range" value="custom">
                            <span><strong>Personnalisé</strong></span>
                        </label>
                        <div class="amfm-range-custom" data-amfm-gif-custom-range style="display:none;">
                            <span>De :</span>
                            <select class="amfm-select-mini" data-amfm-gif-start aria-label="Échéance de début"></select>
                            <span>À :</span>
                            <select class="amfm-select-mini" data-amfm-gif-end aria-label="Échéance de fin"></select>
                        </div>
                    </div>
                </div>
                <div class="amfm-form-group">
                    <label class="amfm-form-label">Vitesse de lecture</label>
                    <div style="display:flex; gap:8px;">
                        <label class="amfm-radio-card" style="flex:1;">
                            <input type="radio" name="gif-speed" value="333"> <span>×3 (0,33s)</span>
                        </label>
                        <label class="amfm-radio-card" style="flex:1;">
                            <input type="radio" name="gif-speed" value="500"> <span>×2 (0,5s)</span>
                        </label>
                        <label class="amfm-radio-card" style="flex:1;">
                            <input type="radio" name="gif-speed" value="1000" checked> <span>1× (1s Défaut)</span>
                        </label>
                        <label class="amfm-radio-card" style="flex:1;">
                            <input type="radio" name="gif-speed" value="1500"> <span>0,7× (1,5s)</span>
                        </label>
                    </div>
                </div>

                <div class="amfm-progress-container" data-amfm-gif-progress-box style="display:none;">
                    <div class="amfm-progress-text">
                        <span data-amfm-gif-status-text><i class="fa-solid fa-hourglass-half fa-spin"></i> Génération en cours…</span>
                        <span data-amfm-gif-percent>0%</span>
                    </div>
                    <div class="amfm-progress-bar-bg">
                        <div class="amfm-progress-bar-fill" data-amfm-gif-bar></div>
                    </div>
                </div>

                <div class="amfm-modal-actions">
                    <button type="button" class="amfm-btn-generate-gif" data-amfm-gif-submit>
                        <i class="fa-solid fa-download"></i> Lancer la Génération GIF
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/palettes.js?v=2.0.7"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <script src="js/regions.js?v=2.0.7"></script>
    <script src="js/arome-map.js?v=2.0.7"></script>
</body>
</html>
