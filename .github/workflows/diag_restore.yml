name: "DIAG restore-base"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostique restauration base
        run: |
          set -x
          gh --version
          echo "--- gh run list brut (sans filtre) ---"
          gh run list --repo monsieurmeteo/gfs-weather-map \
                --status success --limit 5 --json databaseId,workflowName
          echo "--- jq filtre ---"
          gh run list --repo monsieurmeteo/gfs-weather-map \
                --status success --limit 20 --json databaseId,workflowName --jq \
                '.[] | select(.workflowName | test("Build & Deploy")) | .databaseId'
          echo "--- gh api runs (champ name) ---"
          gh api repos/monsieurmeteo/gfs-weather-map/actions/runs?status=success\&per_page=5 --jq '.workflow_runs[] | {id, name, display_title}'
          echo "--- telechargement test depuis le dernier bon run ---"
          mkdir -p /tmp/base
          gh run download 32977422230 --repo monsieurmeteo/gfs-weather-map \
               -n github-pages -D /tmp/base 2>&1 | head -20
          ls -la /tmp/base | head -10
          echo "FIN DIAG"
