name: Actualisation Automatique AROME HD (Météo-France)

on:
  schedule:
    # Exécution 4 fois par jour après la sortie des runs Météo-France (00z, 06z, 12z, 18z)
    - cron: '30 3,9,15,21 * * *'
  workflow_dispatch:

jobs:
  build-maps:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installation des dépendances météo
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow eccodes cfgrib xarray requests

      - name: Génération des Cartes AROME HD
        run: |
          python generate_arome_maps.py

      - name: Publication des cartes sur GitHub Pages / Branche data
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: data
