name: "GFS Europe — Build & Deploy"

on:
  schedule:
    # 4 fois/jour, après mise à disposition des runs 00Z/06Z/12Z/18Z
    - cron: '30 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = régénère les données ; front = déploie le code seul (~5 min)'
        required: false
        default: 'full'
      max_hours:
        description: 'Échéance GFS max en heures (48 = test rapide, 384 = GFS 16 jours complet)'
        required: false
        default: '384'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages-gfs-eu"
  cancel-in-progress: false

jobs:
  build-fond:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.vars.outputs.mode }}
      max_hours: ${{ steps.vars.outputs.max_hours }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Dépendances Python
        run: pip install -r requirements.txt -q

      - name: Validation + export des variables
        id: vars
        run: |
          MODE="${{ inputs.mode || 'full' }}"
          MAX_HOURS="${{ inputs.max_hours || '384' }}"
          if ! [[ "$MAX_HOURS" =~ ^[0-9]+$ ]] || [ "$MAX_HOURS" -lt 3 ] || [ "$MAX_HOURS" -gt 384 ]; then
            echo "::error::max_hours invalide: '$MAX_HOURS' (attendu 3-384)"
            exit 1
          fi
          echo "mode=$MODE"           >> "$GITHUB_OUTPUT"
          echo "max_hours=$MAX_HOURS" >> "$GITHUB_OUTPUT"

      - name: Générer le fond Europe
        if: steps.vars.outputs.mode != 'front'
        run: |
          cd pipeline
          python -c "
          import sys; sys.path.insert(0, '.')
          import generate_fond_gfs
          generate_fond_gfs.generate('europe')
          print('Fond Europe OK')
          "

      - name: Upload fonds (artefact partagé)
        if: steps.vars.outputs.mode != 'front'
        uses: actions/upload-artifact@v4
        with:
          name: chunk-fonds
          path: output/
          retention-days: 1

  render-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-fond
    if: needs.build-fond.outputs.mode != 'front'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gfs-eu-00-36
            model: gfs
            domain: europe
            lead_min: 0
            lead_max: 36
          - id: gfs-eu-39-72
            model: gfs
            domain: europe
            lead_min: 39
            lead_max: 72
          - id: gfs-eu-75-108
            model: gfs
            domain: europe
            lead_min: 75
            lead_max: 108
          - id: gfs-eu-111-144
            model: gfs
            domain: europe
            lead_min: 111
            lead_max: 144
          - id: gfs-eu-150-240
            model: gfs
            domain: europe
            lead_min: 150
            lead_max: 240
          - id: gfs-eu-252-384
            model: gfs
            domain: europe
            lead_min: 252
            lead_max: 384

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Dépendances système + Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes0 libeccodes-tools
          pip install -r requirements.txt -q

      - name: Pipeline (${{ matrix.id }})
        run: |
          MAX_HOURS="${{ needs.build-fond.outputs.max_hours }}"
          if [ "${{ matrix.lead_min }}" -gt "$MAX_HOURS" ]; then
            echo "Tranche hors limite max demandée ($MAX_HOURS h) — ignoré"
            exit 0
          fi
          python -u pipeline/gfs_open_data.py \
            --max-hours "$MAX_HOURS" \
            --domain "${{ matrix.domain }}" \
            --lead-min "${{ matrix.lead_min }}" \
            --lead-max "${{ matrix.lead_max }}"

      - name: Upload chunk (${{ matrix.id }})
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.id }}
          path: output/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-fond, render-chunks]
    if: always() && (needs.render-chunks.result == 'success' || needs.build-fond.outputs.mode == 'front')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances Python
        run: pip install -r requirements.txt -q

      - name: Base du dernier déploiement (garde les autres modèles à jour)
        run: |
          set -e
          mkdir -p /tmp/base
          RESTORED=""
          for RUN_ID in $(gh run list --repo monsieurmeteo/gfs-weather-map \
                --status success --limit 10 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            if gh run download "$RUN_ID" --repo monsieurmeteo/gfs-weather-map \
                 -n github-pages -D /tmp/base >/dev/null 2>&1; then
              RESTORED="$RUN_ID"
              break
            fi
          done
          if [ -z "$RESTORED" ]; then
            echo "::error::Aucun artefact github-pages récent à restaurer — déploiement annulé (l'ancien site reste en ligne)"
            exit 1
          fi
          tar -xf /tmp/base/artifact.tar -C .
          echo "Base restaurée depuis le run $RESTORED (GFS Europe sera superposé)"

      - name: Téléchargement des chunks GFS Europe
        uses: actions/download-artifact@v4
        with:
          pattern: |
            chunk-fonds
            chunk-gfs-eu-*
          path: output/
          merge-multiple: true

      - name: Assemblage des manifests index.json
        run: python -u pipeline/assemble.py

      - name: Préparation du site statique
        run: |
          mkdir -p _site
          cp index.html _site/
          cp logo.png _site/ 2>/dev/null || true
          cp -r js _site/
          cp -r output _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
