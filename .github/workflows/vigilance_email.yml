name: Envoi Cartes de Vigilance - Email Automatique

on:
  schedule:
    # Deux fois par jour à 5h30 et 15h00 UTC (soit 7h30 et 17h00 en France)
    - cron: '30 5,15 * * *'
  workflow_dispatch: # Permet de forcer manuellement le lancement depuis GitHub

permissions:
  contents: read

jobs:
  capture-and-email:
    runs-on: windows-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v3

      - name: Configurer Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          pip install playwright pillow
          playwright install chromium

      - name: Étape 1 - Capturer et Envoyer les Cartes de Vigilance par E-mail
        env:
          SFR_PASSWORD: ${{ secrets.SFR_PASSWORD }}
        run: |
          python "send_vigilance_images.py"
