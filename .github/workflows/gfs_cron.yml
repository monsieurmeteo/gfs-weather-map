            model: gfs
            domain: france
            lead_min: 0
            lead_max: 36
          - id: gfs-fr-39-72
            model: gfs
            domain: france
            lead_min: 39
            lead_max: 72
          - id: gfs-fr-75-108
            model: gfs
            domain: france
            lead_min: 75
            lead_max: 108
          - id: gfs-fr-111-144
            model: gfs
            domain: france
            lead_min: 111
            lead_max: 144
          - id: gfs-fr-150-240
            model: gfs
            domain: france
            lead_min: 150
            lead_max: 240
          - id: gfs-fr-252-384
            model: gfs
            domain: france
            lead_min: 252
            lead_max: 384

          # ── ARPEGE Europe (4 groupes, produit GLOB025 0,25° pleine couverture) ──
          - id: arp-eu-00-24
            model: arpege
            domain: europe
            lead_min: 0
            lead_max: 24
          - id: arp-eu-25-48
            model: arpege
            domain: europe
            lead_min: 25
            lead_max: 48
          - id: arp-eu-49-72
            model: arpege
            domain: europe
            lead_min: 49
            lead_max: 72
          - id: arp-eu-73-102
            model: arpege
            domain: europe
            lead_min: 73
            lead_max: 102

          # ── ARPEGE France (4 groupes, produit EURAT01 0,1° haute résolution 11 km) ──
          - id: arp-fr-00-24
            model: arpege
            domain: france
            lead_min: 0
            lead_max: 24
          - id: arp-fr-25-48
            model: arpege
            domain: france
            lead_min: 25
            lead_max: 48
          - id: arp-fr-49-72
            model: arpege
            domain: france
            lead_min: 49
            lead_max: 72
          - id: arp-fr-73-102
            model: arpege
            domain: france
            lead_min: 73
            lead_max: 102

          # ── GFS Arc Antillais (3 groupes) ───────────────────────────────────
          - id: gfs-ant-00-072
            model: gfs
            domain: antilles
            lead_min: 0
            lead_max: 72
          - id: gfs-ant-075-168
            model: gfs
            domain: antilles
            lead_min: 75
            lead_max: 168
          - id: gfs-ant-171-384
            model: gfs
            domain: antilles
            lead_min: 171
            lead_max: 384

          # ── GFS États-Unis (3 groupes) ──────────────────────────────────────
          - id: gfs-usa-00-072
            model: gfs
            domain: etats_unis
            lead_min: 0
            lead_max: 72
          - id: gfs-usa-075-168
            model: gfs
            domain: etats_unis
            lead_min: 75
            lead_max: 168
          - id: gfs-usa-171-384
            model: gfs
            domain: etats_unis
            lead_min: 171
            lead_max: 384

          # ── AIFS Arc Antillais (2 groupes, max 240 h) ───────────────────────
          - id: aifs-ant-00-120
            model: aifs
            domain: antilles
            lead_min: 0
            lead_max: 120
          - id: aifs-ant-126-240
            model: aifs
            domain: antilles
            lead_min: 126
            lead_max: 240

          # ── AIFS États-Unis (2 groupes, max 240 h) ──────────────────────────
          - id: aifs-usa-00-120
            model: aifs
            domain: etats_unis
            lead_min: 0
            lead_max: 120
          - id: aifs-usa-126-240
            model: aifs
            domain: etats_unis
            lead_min: 126
            lead_max: 240

          # ── GFS Asie de l'Est & Typhons (Chine • Japon • Corée) ─────────────
          - id: gfs-pac-00-072
            model: gfs
            domain: pacifique_ouest
            lead_min: 0
            lead_max: 72
          - id: gfs-pac-075-168
            model: gfs
            domain: pacifique_ouest
            lead_min: 75
            lead_max: 168
          - id: gfs-pac-171-384
            model: gfs
            domain: pacifique_ouest
            lead_min: 171
            lead_max: 384

          # ── AIFS Asie de l'Est (Chine • Japon • Corée, max 240 h) ───────────
          - id: aifs-pac-00-120
            model: aifs
            domain: pacifique_ouest
            lead_min: 0
            lead_max: 120
          - id: aifs-pac-126-240
            model: aifs
            domain: pacifique_ouest
            lead_min: 126
            lead_max: 240

          # ── GFS Asie du Sud & Inde ──────────────────────────────────────────
          - id: gfs-ind-00-072
            model: gfs
            domain: ocean_indien_nord
            lead_min: 0
            lead_max: 72
          - id: gfs-ind-075-168
            model: gfs
            domain: ocean_indien_nord
            lead_min: 75
            lead_max: 168
          - id: gfs-ind-171-384
            model: gfs
            domain: ocean_indien_nord
            lead_min: 171
            lead_max: 384

          # ── AIFS Asie du Sud & Inde (max 240 h) ─────────────────────────────
          - id: aifs-ind-00-120
            model: aifs
            domain: ocean_indien_nord
            lead_min: 0
            lead_max: 120
          - id: aifs-ind-126-240
            model: aifs
            domain: ocean_indien_nord
            lead_min: 126
            lead_max: 240

          # ── GFS Pacifique Est (Ouragans Lowell, Marie, Karina • Hawaï) ──────
          - id: gfs-pe-00-072
            model: gfs
            domain: pacifique_est
            lead_min: 0
            lead_max: 72
          - id: gfs-pe-075-168
            model: gfs
            domain: pacifique_est
            lead_min: 75
            lead_max: 168
          - id: gfs-pe-171-384
            model: gfs
            domain: pacifique_est
            lead_min: 171
            lead_max: 384

          # ── AIFS Pacifique Est (Ouragans Lowell, Marie, Karina, max 240 h) ──
          - id: aifs-pe-00-120
            model: aifs
            domain: pacifique_est
            lead_min: 0
            lead_max: 120
          - id: aifs-pe-126-240
            model: aifs
            domain: pacifique_est
            lead_min: 126
            lead_max: 240

          # ── GFS Océan Indien (Réunion • Maurice • Madagascar) ───────────────
          - id: gfs-oi-00-072
            model: gfs
            domain: ocean_indien
            lead_min: 0
            lead_max: 72
          - id: gfs-oi-075-168
            model: gfs
            domain: ocean_indien
            lead_min: 75
            lead_max: 168
          - id: gfs-oi-171-384
            model: gfs
            domain: ocean_indien
            lead_min: 171
            lead_max: 384

          # ── AIFS Océan Indien (max 240 h) ───────────────────────────────────
          - id: aifs-oi-00-120
            model: aifs
            domain: ocean_indien
            lead_min: 0
            lead_max: 120
          - id: aifs-oi-126-240
            model: aifs
            domain: ocean_indien
            lead_min: 126
            lead_max: 240

          # ── GFS Pacifique Sud (Nouvelle-Calédonie • Fidji • Vanuatu) ─────────
          - id: gfs-ps-00-072
            model: gfs
            domain: pacifique_sud
            lead_min: 0
            lead_max: 72
          - id: gfs-ps-075-168
            model: gfs
            domain: pacifique_sud
            lead_min: 75
            lead_max: 168
          - id: gfs-ps-171-384
            model: gfs
            domain: pacifique_sud
            lead_min: 171
            lead_max: 384

          # ── AIFS Pacifique Sud (max 240 h) ──────────────────────────────────
          - id: aifs-ps-00-120
            model: aifs
            domain: pacifique_sud
            lead_min: 0
            lead_max: 120
          - id: aifs-ps-126-240
            model: aifs
            domain: pacifique_sud
            lead_min: 126
            lead_max: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Dépendances système + Python
        run: |
          for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq --fix-missing libeccodes0 libeccodes-tools && break || sleep 3; done
          pip install -r requirements.txt -q

      - name: Pipeline (${{ matrix.id }})
        run: |
          MAX_HOURS="${{ needs.build-fond.outputs.max_hours }}"
          if [ "${{ matrix.lead_min }}" -gt "$MAX_HOURS" ]; then
            echo "Tranche hors limite max demandée ($MAX_HOURS h) — ignoré"
            exit 0
          fi
          if [ "${{ matrix.model }}" = "gfs" ]; then
            python -u pipeline/gfs_open_data.py \
              --max-hours "$MAX_HOURS" \
              --domain "${{ matrix.domain }}" \
              --lead-min "${{ matrix.lead_min }}" \
              --lead-max "${{ matrix.lead_max }}"
          elif [ "${{ matrix.model }}" = "aifs" ]; then
            python -u pipeline/aifs_open_data.py \
              --max-hours "$MAX_HOURS" \
              --domain "${{ matrix.domain }}" \
              --lead-min "${{ matrix.lead_min }}" \
              --lead-max "${{ matrix.lead_max }}"
          else
            python -u pipeline/arpege_open_data.py \
              --max-hours "$MAX_HOURS" \
              --domain "${{ matrix.domain }}" \
              --lead-min "${{ matrix.lead_min }}" \
              --lead-max "${{ matrix.lead_max }}"
          fi

      - name: Upload chunk (${{ matrix.id }})
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.id }}
          path: output/
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — Assemblage des 18 Groupes + Déploiement GitHub Pages
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-fond, render-chunks]
    if: always() && (needs.render-chunks.result == 'success' || needs.build-fond.outputs.mode == 'front')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dépendances Python
        run: pip install -r requirements.txt -q

      - name: Base du dernier déploiement (préserve les autres modèles)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/base /tmp/base/restored
          RESTORED=""
          for RUN_ID in $(gh run list --repo monsieurmeteo/gfs-weather-map \
                --status success --limit 5 --json databaseId,workflowName --jq \
                '.[] | select(.workflowName | test("Build & Deploy")) | .databaseId' 2>/dev/null || true); do
            echo "Tentative de restauration depuis le run $RUN_ID..."
            if gh run download "$RUN_ID" --repo monsieurmeteo/gfs-weather-map \
                 -n github-pages -D /tmp/base >/dev/null 2>&1; then
              RESTORED="$RUN_ID"
              break
            fi
          done
          if [ -n "$RESTORED" ]; then
            tar -xf /tmp/base/artifact.tar -C /tmp/base/restored
            cp -r /tmp/base/restored/output ./ 2>/dev/null || true
            echo "Base restaurée depuis le run $RESTORED (output/ fusionné)"
          else
            echo "Attention : Aucun artefact précédent trouvé."
          fi

      - name: Purge des répertoires régénérés (évite les dalles obsolètes)
        if: needs.build-fond.outputs.mode != 'front'
        run: |
          # La base restaurée contient d'anciennes dalles du modèle en cours :
          # on les purge pour que la fusion des chunks les remplace à 100%.
          rm -rf output/gfs output/gfs_france output/gfs_antilles output/gfs_etats_unis output/gfs_pacifique_ouest output/gfs_ocean_indien_nord output/gfs_pacifique_est output/gfs_ocean_indien output/gfs_pacifique_sud \
                 output/arpege output/arpege_france \
                 output/aifs output/aifs_france output/aifs_antilles output/aifs_etats_unis output/aifs_pacifique_ouest output/aifs_ocean_indien_nord
          echo "Répertoires GFS/ARPEGE/AIFS purgés (seront recréés par les chunks)"

      - name: Téléchargement de TOUS les chunks (fusion automatique)
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: output/
          merge-multiple: true
          if-no-files-found: ignore

      - name: Génération des fonds et frontières universels
        run: |
          python -u pipeline/generate_fond_gfs.py --domain all
          python -u pipeline/cyclone_tracker.py
      - name: Assemblage des manifests index.json
        run: python -u pipeline/assemble.py

      - name: Préparation du site statique
        run: |
          mkdir -p _site
          cp index.html _site/
          cp logo*.png _site/ 2>/dev/null || true
          cp cyclones_actifs.json _site/ 2>/dev/null || true
          cp output/cyclones_actifs.json _site/ 2>/dev/null || true
          touch _site/.nojekyll
          cp -r js _site/
          cp -r config _site/ 2>/dev/null || true
          cp -r output _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
