name: "Météo Multi-modèles GFS & ARPEGE — Build & Deploy"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = régénère les données ; front = déploie le code seul (~5 min)'
        required: false
        default: 'full'
      max_hours:
        description: 'Échéance GFS max en heures (48 = test rapide, 384 = GFS 16 jours complet)'
        required: false
        default: '384'
      models:
        description: 'Modèles à lancer : gfs, arpege ou gfs,arpege'
        required: false
        default: 'gfs,arpege'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Fonds de carte partagés
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-fond:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.vars.outputs.mode }}
      max_hours: ${{ steps.vars.outputs.max_hours }}
      models: ${{ steps.vars.outputs.models }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Dépendances Python
        run: pip install -r requirements.txt -q

      - name: Validation + export des variables
        id: vars
        run: |
          MODE="${{ inputs.mode || 'full' }}"
          MAX_HOURS="${{ inputs.max_hours || '384' }}"
          MODELS="${{ inputs.models || 'gfs,arpege' }}"
          if ! [[ "$MAX_HOURS" =~ ^[0-9]+$ ]] || [ "$MAX_HOURS" -lt 3 ] || [ "$MAX_HOURS" -gt 384 ]; then
            echo "::error::max_hours invalide: '$MAX_HOURS' (attendu 3-384)"
            exit 1
          fi
          echo "mode=$MODE"           >> "$GITHUB_OUTPUT"
          echo "max_hours=$MAX_HOURS" >> "$GITHUB_OUTPUT"
          echo "models=$MODELS"       >> "$GITHUB_OUTPUT"

      - name: Générer les fonds (Europe + France)
        if: steps.vars.outputs.mode != 'front'
        run: |
          python -u pipeline/generate_fond_gfs.py --domain europe
          python -u pipeline/generate_fond_gfs.py --domain france

      - name: Upload fonds (artefact partagé)
        if: steps.vars.outputs.mode != 'front'
        uses: actions/upload-artifact@v4
        with:
          name: chunk-fonds
          path: output/
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Matrice 18 Groupes Parallèles (GFS Europe + France, ARPEGE Europe + France)
# ─────────────────────────────────────────────────────────────────────────────
  render-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-fond
    if: needs.build-fond.outputs.mode != 'front'
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── GFS Europe (6 groupes) ──────────────────────────────
          - id: gfs-eu-00-36
            model: gfs
            domain: europe
            lead_min: 0
            lead_max: 36
          - id: gfs-eu-39-72
            model: gfs
            domain: europe
            lead_min: 39
            lead_max: 72
          - id: gfs-eu-75-108
            model: gfs
            domain: europe
            lead_min: 75
            lead_max: 108
          - id: gfs-eu-111-144
            model: gfs
            domain: europe
            lead_min: 111
            lead_max: 144
          - id: gfs-eu-150-240
            model: gfs
            domain: europe
            lead_min: 150
            lead_max: 240
          - id: gfs-eu-252-384
            model: gfs
            domain: europe
            lead_min: 252
            lead_max: 384

          # ── GFS France (6 groupes) ──────────────────────────────
          - id: gfs-fr-00-36
            model: gfs
            domain: france
            lead_min: 0
            lead_max: 36
          - id: gfs-fr-39-72
            model: gfs
            domain: france
            lead_min: 39
            lead_max: 72
          - id: gfs-fr-75-108
            model: gfs
            domain: france
            lead_min: 75
            lead_max: 108
          - id: gfs-fr-111-144
            model: gfs
            domain: france
            lead_min: 111
            lead_max: 144
          - id: gfs-fr-150-240
            model: gfs
            domain: france
            lead_min: 150
            lead_max: 240
          - id: gfs-fr-252-384
            model: gfs
            domain: france
            lead_min: 252
            lead_max: 384

          # ── ARPEGE Europe (4 groupes, produit GLOB025 0,25° pleine couverture) ──
          - id: arp-eu-00-24
            model: arpege
            domain: europe
            lead_min: 0
            lead_max: 24
          - id: arp-eu-25-48
            model: arpege
            domain: europe
            lead_min: 25
            lead_max: 48
          - id: arp-eu-49-72
            model: arpege
            domain: europe
            lead_min: 49
            lead_max: 72
          - id: arp-eu-73-102
            model: arpege
            domain: europe
            lead_min: 73
            lead_max: 102

          # ── ARPEGE France (4 groupes, produit EURAT01 0,1° haute résolution 11 km) ──
          - id: arp-fr-00-24
            model: arpege
            domain: france
            lead_min: 0
            lead_max: 24
          - id: arp-fr-25-48
            model: arpege
            domain: france
            lead_min: 25
            lead_max: 48
          - id: arp-fr-49-72
            model: arpege
            domain: france
            lead_min: 49
            lead_max: 72
          - id: arp-fr-73-102
            model: arpege
            domain: france
            lead_min: 73
            lead_max: 102

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Dépendances système + Python
        run: |
          for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq --fix-missing libeccodes0 libeccodes-tools && break || sleep 3; done
          pip install -r requirements.txt -q

      - name: Pipeline (${{ matrix.id }})
        run: |
          MAX_HOURS="${{ needs.build-fond.outputs.max_hours }}"
          if [ "${{ matrix.lead_min }}" -gt "$MAX_HOURS" ]; then
            echo "Tranche hors limite max demandée ($MAX_HOURS h) — ignoré"
            exit 0
          fi
          if [ "${{ matrix.model }}" = "gfs" ]; then
            python -u pipeline/gfs_open_data.py \
              --max-hours "$MAX_HOURS" \
              --domain "${{ matrix.domain }}" \
              --lead-min "${{ matrix.lead_min }}" \
              --lead-max "${{ matrix.lead_max }}"
          else
            python -u pipeline/arpege_open_data.py \
              --max-hours "$MAX_HOURS" \
              --domain "${{ matrix.domain }}" \
              --lead-min "${{ matrix.lead_min }}" \
              --lead-max "${{ matrix.lead_max }}"
          fi

      - name: Upload chunk (${{ matrix.id }})
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.id }}
          path: output/
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — Assemblage des 18 Groupes + Déploiement GitHub Pages
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-fond, render-chunks]
    if: always() && (needs.render-chunks.result == 'success' || needs.build-fond.outputs.mode == 'front')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dépendances Python
        run: pip install -r requirements.txt -q

      - name: Base du dernier déploiement (préserve les autres modèles)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/base
          RESTORED=""
          # Seuls les artefacts des workflows météo (nom 'Build & Deploy' + contenu output/)
          # sont acceptés : les github-pages d'autres automatisations sont ignorés.
          for RUN_ID in $(gh run list --repo monsieurmeteo/gfs-weather-map \
                --status success --limit 20 --json databaseId,workflowName --jq \
                '.[] | select(.workflowName | test("Build & Deploy")) | .databaseId' 2>/dev/null || true); do
            if gh run download "$RUN_ID" --repo monsieurmeteo/gfs-weather-map \
                 -n github-pages -D /tmp/base >/dev/null 2>&1; then
              if tar -tf /tmp/base/artifact.tar 2>/dev/null | grep -q "output/"; then
                RESTORED="$RUN_ID"
                break
              fi
              rm -rf /tmp/base
              mkdir -p /tmp/base
            fi
          done
          if [ -z "$RESTORED" ]; then
            echo "::error::Aucun artefact github-pages météo récent à restaurer — déploiement annulé (l'ancien site reste en ligne)"
            exit 1
          fi
          # Extraire dans un dossier SÉPARÉ puis ne copier QUE output/ :
          # on préserve index.html + js/ du checkout (code le plus récent),
          # sinon la restauration écraserait le code avec l'ancien site.
          mkdir -p /tmp/base/restored
          tar -xf /tmp/base/artifact.tar -C /tmp/base/restored
          cp -r /tmp/base/restored/output ./
          echo "Base restaurée depuis le run $RESTORED (output/ fusionné, code du repo conservé)"

      - name: Purge des répertoires régénérés (évite les dalles obsolètes)
        if: needs.build-fond.outputs.mode != 'front'
        run: |
          # La base restaurée contient d'anciennes dalles du modèle en cours :
          # on les purge pour que la fusion des chunks les remplace à 100%.
          rm -rf output/gfs output/gfs_france output/arpege output/arpege_france
          echo "Répertoires GFS/ARPEGE purgés (seront recréés par les chunks)"

      - name: Téléchargement de TOUS les chunks (fusion automatique)
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: output/
          merge-multiple: true
          if-no-files-found: ignore

      - name: Génération des fonds et frontières universels
        run: |
          python -u pipeline/generate_fond_gfs.py --domain europe
          python -u pipeline/generate_fond_gfs.py --domain france
      - name: Assemblage des manifests index.json
        run: python -u pipeline/assemble.py

      - name: Préparation du site statique
        run: |
          mkdir -p _site
          cp index.html _site/
          cp logo.png _site/ 2>/dev/null || true
          cp -r js _site/
          cp -r output _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
