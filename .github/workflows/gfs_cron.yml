            model: gfs
            domain: europe
            lead_min: 39
            lead_max: 72
          - id: gfs-eu-75-108
            model: gfs
            domain: europe
            lead_min: 75
            lead_max: 108
          - id: gfs-eu-111-144
            model: gfs
            domain: europe
            lead_min: 111
            lead_max: 144
          - id: gfs-eu-150-240
            model: gfs
            domain: europe
            lead_min: 150
            lead_max: 240
          - id: gfs-eu-252-384
            model: gfs
            domain: europe
            lead_min: 252
            lead_max: 384

          # ── GFS France (6 groupes) ──────────────────────────────
