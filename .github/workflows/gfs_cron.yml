name: "Météo Multi-modèles GFS & ARPEGE — Build & Deploy"

on:
  schedule:
    # 4 fois/jour, après mise à disposition des runs 00Z/06Z/12Z/18Z
    - cron: '30 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = régénère les données ; front = déploie le code seul (~5 min)'
        required: false
        default: 'full'
      max_hours:
        description: 'Échéance GFS max en heures (48 = test rapide, 384 = GFS 16 jours complet)'
        required: false
        default: '384'
      models:
        description: 'Modèles à lancer : gfs, arpege ou gfs,arpege'
        required: false
        default: 'gfs,arpege'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Fonds de carte partagés
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-fond:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.vars.outputs.mode }}
      max_hours: ${{ steps.vars.outputs.max_hours }}
      models: ${{ steps.vars.outputs.models }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Dépendances Python
        run: pip install -r requirements.txt -q

      - name: Validation + export des variables
        id: vars
        run: |
          MODE="${{ inputs.mode || 'full' }}"
          MAX_HOURS="${{ inputs.max_hours || '384' }}"
          MODELS="${{ inputs.models || 'gfs,arpege' }}"
          if ! [[ "$MAX_HOURS" =~ ^[0-9]+$ ]] || [ "$MAX_HOURS" -lt 3 ] || [ "$MAX_HOURS" -gt 384 ]; then
            echo "::error::max_hours invalide: '$MAX_HOURS' (attendu 3-384)"
            exit 1
          fi
          echo "mode=$MODE"           >> "$GITHUB_OUTPUT"
          echo "max_hours=$MAX_HOURS" >> "$GITHUB_OUTPUT"
          echo "models=$MODELS"       >> "$GITHUB_OUTPUT"

      - name: Générer les fonds (europe + france + arpege)
        if: steps.vars.outputs.mode != 'front'
        run: |
          cd pipeline
          python -c "
          import sys; sys.path.insert(0, '.')
          import generate_fond_gfs
          generate_fond_gfs.generate('europe')
          generate_fond_gfs.generate('france')
          import shutil, os
          # generate('europe') écrit déjà les fonds Europe dans gfs/maps ET arpege/maps.
          # generate('france') écrit les fonds France (Mercator) dans gfs_france/maps :
          # on les copie vers arpege_france/maps (jamais les fonds Europe !).
          src_fr = '../output/gfs_france/maps'
          dst_fr = '../output/arpege_france/maps'
          os.makedirs(dst_fr, exist_ok=True)
          for f in ('fond.webp', 'mask_france.png', 'frontieres.svg'):
              s = os.path.join(src_fr, f)
              if os.path.exists(s): shutil.copy(s, dst_fr)
          print('Fonds OK')
          "

      - name: Upload fonds (artefact partagé)
        if: steps.vars.outputs.mode != 'front'
        uses: actions/upload-artifact@v4
        with:
          name: chunk-fonds
          path: output/
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Matrice 18 Groupes Parallèles (GFS Europe + France, ARPEGE Europe + France)
# ─────────────────────────────────────────────────────────────────────────────
  render-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-fond
    if: needs.build-fond.outputs.mode != 'front'
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── GFS Europe (6 groupes) ──────────────────────────────
          - id: gfs-eu-00-36
            model: gfs
            domain: europe
            lead_min: 0
            lead_max: 36
          - id: gfs-eu-39-72
            model: gfs
            domain: europe
            lead_min: 39
            lead_max: 72
          - id: gfs-eu-75-108
            model: gfs
            domain: europe
            lead_min: 75
            lead_max: 108
          - id: gfs-eu-111-144
            model: gfs
            domain: europe
            lead_min: 111
            lead_max: 144
          - id: gfs-eu-150-240
            model: gfs
            domain: europe
            lead_min: 150
            lead_max: 240
          - id: gfs-eu-252-384
            model: gfs
            domain: europe
            lead_min: 252
            lead_max: 384

          # ── GFS France (6 groupes) ──────────────────────────────
          - id: gfs-fr-00-36
            model: gfs
            domain: france
            lead_min: 0
            lead_max: 36
          - id: gfs-fr-39-72
            model: gfs
            domain: france
            lead_min: 39
            lead_max: 72
          - id: gfs-fr-75-108
            model: gfs
            domain: france
            lead_min: 75
            lead_max: 108
          - id: gfs-fr-111-144
            model: gfs
            domain: france
            lead_min: 111
            lead_max: 144
          - id: gfs-fr-150-240
            model: gfs
            domain: france
            lead_min: 150
            lead_max: 240
          - id: gfs-fr-252-384
            model: gfs
            domain: france
            lead_min: 252
            lead_max: 384

          # ── ARPEGE (6 groupes × 2 domaines : Europe + France, produit 01 0,1°) ──
          - id: arp-eu-00-18
            model: arpege
            domain: both
            lead_min: 0
            lead_max: 18
          - id: arp-eu-21-36
            model: arpege
            domain: both
            lead_min: 21
            lead_max: 36
          - id: arp-eu-39-54
            model: arpege
            domain: both
            lead_min: 39
            lead_max: 54
          - id: arp-eu-57-72
            model: arpege
            domain: both
            lead_min: 57
            lead_max: 72
          - id: arp-eu-75-90
            model: arpege
            domain: both
            lead_min: 75
            lead_max: 90
          - id: arp-eu-93-102
            model: arpege
            domain: both
            lead_min: 93
            lead_max: 102

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Dépendances système + Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes0 libeccodes-tools
          pip install -r requirements.txt -q

      - name: Pipeline (${{ matrix.id }})
        run: |
          MAX_HOURS="${{ needs.build-fond.outputs.max_hours }}"
          if [ "${{ matrix.lead_min }}" -gt "$MAX_HOURS" ]; then
            echo "Tranche hors limite max demandée ($MAX_HOURS h) — ignoré"
            exit 0
          fi
          if [ "${{ matrix.model }}" = "gfs" ]; then
            python -u pipeline/gfs_open_data.py \
              --max-hours "$MAX_HOURS" \
              --domain "${{ matrix.domain }}" \
              --lead-min "${{ matrix.lead_min }}" \
              --lead-max "${{ matrix.lead_max }}"
          else
            python -u pipeline/arpege_open_data.py \
              --max-hours "$MAX_HOURS" \
              --domain "${{ matrix.domain }}" \
              --lead-min "${{ matrix.lead_min }}" \
              --lead-max "${{ matrix.lead_max }}"
          fi

      - name: Upload chunk (${{ matrix.id }})
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.id }}
          path: output/
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — Assemblage des 18 Groupes + Déploiement GitHub Pages
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-fond, render-chunks]
    if: always() && (needs.render-chunks.result == 'success' || needs.build-fond.outputs.mode == 'front')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances Python
        run: pip install -r requirements.txt -q

      - name: Base de données du dernier déploiement (mode front)
        if: needs.build-fond.outputs.mode == 'front'
        run: |
          set -e
          LAST=$(gh run list --repo monsieurmeteo/gfs-weather-map --workflow gfs_cron.yml \
                 --status success --limit 10 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -z "$LAST" ]; then
            echo "::error::Aucun run réussi précédent pour restaurer les dalles (mode front)"
            exit 1
          fi
          mkdir -p /tmp/base
          gh run download "$LAST" --repo monsieurmeteo/gfs-weather-map -n github-pages -D /tmp/base
          tar -xf /tmp/base/artifact.tar -C .
          echo "Dalles restaurées depuis le run $LAST (mode front : seule l'UI change)"

      - name: Téléchargement de TOUS les chunks (fusion automatique)
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: output/
          merge-multiple: true

      - name: Assemblage des manifests index.json
        run: python -u pipeline/assemble.py

      - name: Préparation du site statique
        run: |
          mkdir -p _site
          cp index.html _site/
          cp logo.png _site/ 2>/dev/null || true
          cp -r js _site/
          cp -r output _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
