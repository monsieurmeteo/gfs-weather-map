name: "Météo Multi-modèles GFS & ARPEGE — Build & Deploy"

on:
  schedule:
    # 4 fois/jour, après mise à disposition des runs 00Z/06Z/12Z/18Z
    # (GFS prêt ~3h45, ARPEGE ~4h30 → 05:30/11:30/17:30/23:30 UTC)
    - cron: '30 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = régénère les données ; front = déploie le code seul (~5 min)'
        required: false
        default: 'full'
      max_hours:
        description: 'Échéance GFS max en heures (6 = rapide, 102 = ARPEGE, 384 = GFS 16 jours complet)'
        required: false
        default: '384'
      models:
        description: 'Modèles à lancer : gfs, arpege ou gfs,arpege'
        required: false
        default: 'gfs,arpege'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Fonds de carte partagés (Europe + France)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-fond:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.vars.outputs.mode }}
      max_hours: ${{ steps.vars.outputs.max_hours }}
      models: ${{ steps.vars.outputs.models }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q

      - name: Validation + export des variables
        id: vars
        run: |
          MODE="${{ inputs.mode || 'full' }}"
          MAX_HOURS="${{ inputs.max_hours || '384' }}"
          MODELS="${{ inputs.models || 'gfs,arpege' }}"
          if ! [[ "$MAX_HOURS" =~ ^[0-9]+$ ]] || [ "$MAX_HOURS" -lt 3 ] || [ "$MAX_HOURS" -gt 384 ]; then
            echo "::error::max_hours invalide: '$MAX_HOURS' (attendu 3-384)"
            exit 1
          fi
          case "$MODELS" in
            gfs|arpege|"gfs,arpege"|"arpege,gfs") ;;
            *) echo "::error::models invalide: '$MODELS'"; exit 1 ;;
          esac
          case "$MODE" in
            full|front) ;;
            *) echo "::error::mode invalide: '$MODE' (full ou front)"; exit 1 ;;
          esac
          echo "mode=$MODE"       >> "$GITHUB_OUTPUT"
          echo "max_hours=$MAX_HOURS" >> "$GITHUB_OUTPUT"
          echo "models=$MODELS"   >> "$GITHUB_OUTPUT"

      - name: Générer les fonds (europe + france → arpege aussi)
        if: steps.vars.outputs.mode != 'front'
        run: |
          cd pipeline
          python -c "
          import sys; sys.path.insert(0,'.')
          import generate_fond_gfs
          generate_fond_gfs.generate('europe')
          generate_fond_gfs.generate('france')
          import shutil, os
          src = '../output/gfs/maps'
          dst = '../output/arpege/maps'
          os.makedirs(dst, exist_ok=True)
          for f in ('fond.webp','mask_france.png','frontieres.svg'):
              s = os.path.join(src, f)
              if os.path.exists(s): shutil.copy(s, dst)
          print('Fonds OK')
          "

      - name: Upload fonds (artefact partagé)
        if: steps.vars.outputs.mode != 'front'
        uses: actions/upload-artifact@v4
        with:
          name: fonds-de-carte
          path: output/
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — GFS Europe + France  (parallèle avec ARPEGE)
# ─────────────────────────────────────────────────────────────────────────────
  build-gfs:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    needs: build-fond
    if: |
      needs.build-fond.outputs.mode != 'front' &&
      (contains(needs.build-fond.outputs.models, 'gfs') || github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances système (eccodes)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeccodes0 libeccodes-tools

      - name: Dépendances Python
        run: python -m pip install --upgrade pip -q && pip install -r requirements.txt -q

      - name: Récupération des fonds
        uses: actions/download-artifact@v4
        with:
          name: fonds-de-carte
          path: output/

      - name: Pipeline GFS (Europe + France)
        run: |
          python -u pipeline/run_all.py \
            --max-hours "${{ needs.build-fond.outputs.max_hours }}" \
            --models gfs \
            --skip-fonds

      - name: Upload dalles GFS
        uses: actions/upload-artifact@v4
        with:
          name: dalles-gfs
          path: output/gfs/
          retention-days: 1

      - name: Upload dalles GFS France
        uses: actions/upload-artifact@v4
        with:
          name: dalles-gfs-france
          path: output/gfs_france/
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — ARPEGE Europe  (parallèle avec GFS)
# ─────────────────────────────────────────────────────────────────────────────
  build-arpege:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-fond
    if: |
      needs.build-fond.outputs.mode != 'front' &&
      (contains(needs.build-fond.outputs.models, 'arpege') || github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances système (eccodes)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeccodes0 libeccodes-tools

      - name: Dépendances Python
        run: python -m pip install --upgrade pip -q && pip install -r requirements.txt -q

      - name: Récupération des fonds
        uses: actions/download-artifact@v4
        with:
          name: fonds-de-carte
          path: output/

      - name: Pipeline ARPEGE
        run: |
          python -u pipeline/run_all.py \
            --max-hours 102 \
            --models arpege \
            --skip-fonds

      - name: Upload dalles ARPEGE
        uses: actions/upload-artifact@v4
        with:
          name: dalles-arpege
          path: output/arpege/
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — Assemblage + Déploiement GitHub Pages
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-fond, build-gfs, build-arpege]
    if: always() && (needs.build-gfs.result == 'success' || needs.build-arpege.result == 'success' || needs.build-fond.outputs.mode == 'front')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Récupération fonds
        if: needs.build-fond.outputs.mode != 'front'
        uses: actions/download-artifact@v4
        with:
          name: fonds-de-carte
          path: output/

      - name: Récupération dalles GFS
        if: needs.build-gfs.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dalles-gfs
          path: output/gfs/

      - name: Récupération dalles GFS France
        if: needs.build-gfs.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dalles-gfs-france
          path: output/gfs_france/

      - name: Récupération dalles ARPEGE
        if: needs.build-arpege.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dalles-arpege
          path: output/arpege/

      - name: Préparation du site statique
        run: |
          mkdir -p _site
          cp index.html _site/
          cp logo.png _site/ 2>/dev/null || true
          cp -r js _site/
          cp -r output _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
