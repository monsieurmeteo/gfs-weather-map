name: "Météo Multi-modèles GFS & ARPEGE — Build & Deploy"

on:
  schedule:
    # 4 fois/jour, après mise à disposition des runs 00Z/06Z/12Z/18Z
    # (GFS prêt ~3h45, ARPEGE ~4h30 → 05:30/11:30/17:30/23:30 UTC)
    - cron: '30 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = régénère les données (~1h30) ; front = déploie le code seul (~5 min, dalles en cache)'
        required: false
        default: 'full'
      max_hours:
        description: 'Échéance GFS max en heures (24 à 120)'
        required: false
        default: '120'
      models:
        description: 'Modèles à lancer : gfs, arpege ou gfs,arpege'
        required: false
        default: 'gfs,arpege'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances système (eccodes)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes0 libeccodes-tools

      - name: Dépendances Python (épinglées)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validation des entrées
        run: |
          # Les inputs sont vides sur les runs planifiés (schedule) :
          # on applique les valeurs par défaut.
          MODE="${{ inputs.mode || 'full' }}"
          MAX_HOURS="${{ inputs.max_hours || '120' }}"
          MODELS="${{ inputs.models || 'gfs,arpege' }}"
          if ! [[ "$MAX_HOURS" =~ ^[0-9]+$ ]] || [ "$MAX_HOURS" -lt 24 ] || [ "$MAX_HOURS" -gt 120 ]; then
            echo "::error::max_hours invalide: '$MAX_HOURS' (attendu 24-120)"
            exit 1
          fi
          case "$MODELS" in
            gfs|arpege|"gfs,arpege"|"arpege,gfs") ;;
            *) echo "::error::models invalide: '$MODELS'"; exit 1 ;;
          esac
          case "$MODE" in
            full|front) ;;
            *) echo "::error::mode invalide: '$MODE' (full ou front)"; exit 1 ;;
          esac
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "MAX_HOURS=$MAX_HOURS" >> "$GITHUB_ENV"
          echo "MODELS=$MODELS" >> "$GITHUB_ENV"

      - name: Restauration des dalles en cache (mode front)
        if: env.MODE == 'front'
        uses: actions/cache/restore@v4
        with:
          path: output
          key: tiles-gfs-arpege-v1

      - name: Vérification des dalles en cache (mode front)
        if: env.MODE == 'front'
        run: |
          if [ ! -d output/gfs/maps ] || [ ! -d output/arpege/maps ]; then
            echo "::error::Dalles absentes du cache — lancez d'abord un run en mode 'full'."
            exit 1
          fi
          echo "Dalles en cache OK (GFS + ARPEGE)."

      - name: Exécution du pipeline multi-modèles
        if: env.MODE != 'front'
        run: python -u pipeline/run_all.py --max-hours "$MAX_HOURS" --models "$MODELS"

      - name: Mise en cache des dalles générées
        if: env.MODE != 'front'
        uses: actions/cache/save@v4
        with:
          path: output
          key: tiles-gfs-arpege-v1

      - name: Préparation du site statique
        run: |
          mkdir -p _site
          cp index.html _site/
          cp logo.png _site/ 2>/dev/null || true
          cp -r js _site/
          cp -r output _site/

      - name: Configuration Pages
        uses: actions/configure-pages@v5

      - name: Téléversement de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
