name: "ICON-EU — Build & Deploy"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = régénère les données ; front = déploie le code seul'
        required: false
        default: 'full'
      max_hours:
        description: 'Échéance max en heures (défaut 120)'
        required: false
        default: '120'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages-icon-eu"
  cancel-in-progress: false

jobs:
  build-fond:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.vars.outputs.mode }}
      max_hours: ${{ steps.vars.outputs.max_hours }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - name: Dépendances Python
        run: pip install -r requirements.txt -q
      - name: Validation + export des variables
        id: vars
        run: |
          MODE="${{ inputs.mode || 'full' }}"
          MAX_HOURS="${{ inputs.max_hours || '120' }}"
          if ! [[ "$MAX_HOURS" =~ ^[0-9]+$ ]] || [ "$MAX_HOURS" -lt 3 ] || [ "$MAX_HOURS" -gt 120 ]; then
            echo "::error::max_hours invalide: '$MAX_HOURS' (attendu 3-120)"
            exit 1
          fi
          echo "mode=$MODE"           >> "$GITHUB_OUTPUT"
          echo "max_hours=$MAX_HOURS" >> "$GITHUB_OUTPUT"
      - name: Générer les fonds (Europe + France)
        if: steps.vars.outputs.mode != 'front'
        run: |
          cd pipeline
          python -c "
          import sys; sys.path.insert(0, '.')
          import generate_fond_gfs
          generate_fond_gfs.generate('europe')
          generate_fond_gfs.generate('france')
          import shutil, os
          for dst in ('../output/icon_eu/maps', '../output/aifs/maps'):
              os.makedirs(dst, exist_ok=True)
              for f in ('fond.webp', 'mask_france.png', 'frontieres.svg'):
                  s = os.path.join('../output/gfs/maps', f)
                  if os.path.exists(s): shutil.copy(s, dst)
          for dst in ('../output/icon_eu_france/maps', '../output/aifs_france/maps'):
              os.makedirs(dst, exist_ok=True)
              for f in ('fond.webp', 'mask_france.png', 'frontieres.svg'):
                  s = os.path.join('../output/gfs_france/maps', f)
                  if os.path.exists(s): shutil.copy(s, dst)
          print('Fonds ICON-EU OK')
          "
      - name: Upload fonds (artefact partagé)
        if: steps.vars.outputs.mode != 'front'
        uses: actions/upload-artifact@v4
        with:
          name: chunk-fonds
          path: output/
          retention-days: 1

  render-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-fond
    if: needs.build-fond.outputs.mode != 'front'
    strategy:
      fail-fast: false
      matrix:
        include:
          # 15 groupes parallèles — leads 0-48 horaires + 51-120 pas 3h.
          # Warmup cumulatif en mode léger (GUST+APCP) pour chaque chunk.
          - id: icn-00-03
            lead_min: 0
            lead_max: 3
          - id: icn-04-07
            lead_min: 4
            lead_max: 7
          - id: icn-08-11
            lead_min: 8
            lead_max: 11
          - id: icn-12-15
            lead_min: 12
            lead_max: 15
          - id: icn-16-19
            lead_min: 16
            lead_max: 19
          - id: icn-20-23
            lead_min: 20
            lead_max: 23
          - id: icn-24-27
            lead_min: 24
            lead_max: 27
          - id: icn-28-31
            lead_min: 28
            lead_max: 31
          - id: icn-32-35
            lead_min: 32
            lead_max: 35
          - id: icn-36-39
            lead_min: 36
            lead_max: 39
          - id: icn-40-43
            lead_min: 40
            lead_max: 43
          - id: icn-44-48
            lead_min: 44
            lead_max: 48
          - id: icn-51-60
            lead_min: 51
            lead_max: 60
          - id: icn-63-84
            lead_min: 63
            lead_max: 84
          - id: icn-87-120
            lead_min: 87
            lead_max: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-
      - name: Dépendances système + Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes0 libeccodes-tools
          pip install -r requirements.txt -q
      - name: Pipeline (${{ matrix.id }})
        run: |
          MAX_HOURS="${{ needs.build-fond.outputs.max_hours }}"
          if [ "${{ matrix.lead_min }}" -gt "$MAX_HOURS" ]; then
            echo "Tranche hors limite ($MAX_HOURS h) — ignoré"
            exit 0
          fi
          python -u pipeline/icon_open_data.py \
            --max-hours "$MAX_HOURS" \
            --domain both \
            --lead-min "${{ matrix.lead_min }}" \
            --lead-max "${{ matrix.lead_max }}"
      - name: Upload chunk (${{ matrix.id }})
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.id }}
          path: output/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-fond, render-chunks]
    if: always() && (needs.render-chunks.result == 'success' || needs.build-fond.outputs.mode == 'front')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dépendances Python
        run: pip install -r requirements.txt -q
      - name: Base du dernier déploiement (préserve les autres modèles)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/base
          RESTORED=""
          for RUN_ID in $(gh run list --repo monsieurmeteo/gfs-weather-map \
                --status success --limit 20 --json databaseId,workflowName --jq \
                '.[] | select(.workflowName | test("Build & Deploy")) | .databaseId' 2>/dev/null || true); do
            if gh run download "$RUN_ID" --repo monsieurmeteo/gfs-weather-map \
                 -n github-pages -D /tmp/base >/dev/null 2>&1; then
              if tar -tf /tmp/base/artifact.tar 2>/dev/null | grep -q "output/"; then
                RESTORED="$RUN_ID"
                break
              fi
              rm -rf /tmp/base
              mkdir -p /tmp/base
            fi
          done
          if [ -z "$RESTORED" ]; then
            echo "::error::Aucun artefact github-pages météo récent à restaurer"
            exit 1
          fi
          tar -xf /tmp/base/artifact.tar -C .
          echo "Base restaurée depuis le run $RESTORED (ICON-EU sera superposé)"
      - name: Téléchargement des chunks ICON-EU
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: output/
          merge-multiple: true
          if-no-files-found: ignore
      - name: Assemblage des manifests index.json
        run: python -u pipeline/assemble.py
      - name: Préparation du site statique
        run: |
          mkdir -p _site
          cp index.html _site/
          cp logo.png _site/ 2>/dev/null || true
          cp -r js _site/
          cp -r output _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
