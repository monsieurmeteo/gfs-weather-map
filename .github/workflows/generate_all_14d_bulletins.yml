name: Génération 32 Bulletins 14J CNews

on:
  schedule:
    # 17h00 heure de Paris en été (15h00 UTC)
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Mode test (envoyer uniquement à Grégory, pas à Patrick)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  generate-bulletins:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer FFmpeg (requis pour la compilation vidéo)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer Playwright Chromium (pour les captures de cartes)
        run: |
          playwright install chromium

      - name: Lancer la génération des 32 bulletins
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_EMAIL: "langlet.gregory@gmail.com"
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEST_MODE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.test_mode == 'true') && 'true' || 'false' }}
        run: |
          python gha_send_all_14d_bulletins.py

      - name: Publier le ZIP sur GitHub Releases (lien stable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP_PATH="cartes_alertes/bulletins_complets_14j.zip"
          TAG="bulletins-14j-latest"
          # Supprimer le release existant s'il existe
          gh release delete "$TAG" --yes 2>/dev/null || true
          # Créer un nouveau release avec le ZIP
          gh release create "$TAG" "$ZIP_PATH" \
            --title "Pack 32 Bulletins Vidéo - 14 Jours" \
            --notes "Dernière mise à jour automatique du $(date '+%d/%m/%Y à %Hh%M'). Contient 32 vidéos : 28 régionales standards à 14 jours, et 4 bulletins de Patrick à 5 jours." \
            --latest
          echo "ZIP de bulletins publié sur GitHub Releases avec succès."
