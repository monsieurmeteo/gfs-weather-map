name: Météo CNews Patrick Automatique

on:
  workflow_dispatch:
    inputs:
      triggered_by:
        description: "Qui déclenche ? (gregory = Gregory seulement, patrick = Patrick + Gregory en copie)"
        required: false
        default: "gregory"

permissions:
  contents: write

jobs:
  # ÉTAPE 1 : Génération des vidéos pour les 16 groupes en parallèle
  generate-videos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group:
          - france_pictos
          - hdf
          - normandie
          - idf
          - grandest
          - ara
          - naq
          - occitanie
          - paca
          - bfc
          - bretagne
          - pdl
          - cvl
          - corse
          - cnews
          - france
      fail-fast: false  # Ne pas tout arrêter si une seule région échoue temporairement

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer FFmpeg et Polices Emoji (requis pour la compilation vidéo)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer Playwright Chromium (pour les captures de cartes)
        run: |
          playwright install chromium

      - name: Generer les cartes pour le groupe (Jours 5, Orientations Paysage et Portrait)
        env:
          PYTHONUNBUFFERED: "1"
          CHROME_PATH: "/usr/bin/google-chrome"
        run: |
          # 1. Cartes & Vidéo Paysage
          python generate_meteofrance_maps.py --zone ${{ matrix.group }} --days 5 --orientation landscape --patrick --temp-highlight
          python generate_video_bulletin.py --zone ${{ matrix.group }} --days 5 --orientation landscape --patrick --skip-maps
          
          # 2. Cartes & Vidéo Portrait (TikTok)
          python generate_meteofrance_maps.py --zone ${{ matrix.group }} --days 5 --orientation portrait --patrick --temp-highlight
          python generate_video_bulletin.py --zone ${{ matrix.group }} --days 5 --orientation portrait --patrick --skip-maps

      - name: Téléverser les vidéos générées pour ce groupe
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.group }}
          path: cartes_alertes/bulletin_${{ matrix.group }}_*.mp4
          retention-days: 1

  # ÉTAPE 2 : Rassemblement, auto-vérification, création du ZIP et envoi
  finalize-bulletins:
    runs-on: ubuntu-latest
    needs: generate-videos

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer FFmpeg (requis pour ffprobe)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Télécharger toutes les vidéos générées en parallèle
        uses: actions/download-artifact@v4
        with:
          path: cartes_alertes/
          merge-multiple: true

      - name: Exécuter l'Auto-Vérification Finale de cohérence (FFprobe)
        run: |
          # Le script échouera (code 1) si une seule vidéo est absente, vide ou tronquée
          python generate_all_bulletins.py --skip-maps

      - name: Créer le fichier ZIP, générer les textes IA et envoyer l'e-mail
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_EMAIL: "langlet.gregory@gmail.com"
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TEST_MODE: "${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.triggered_by == 'patrick') && 'false' || 'true' }}"
        run: |
          python gha_send_cnews_email.py --skip-generation

      - name: Publier le ZIP sur GitHub Releases (lien de téléchargement stable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP_PATH=$(ls cartes_alertes/bulletins_cnews_patrick_*.zip | head -n 1)
          TAG="bulletins-patrick-latest"
          # Supprimer la version précédente de la release
          gh release delete "$TAG" --yes 2>/dev/null || true
          # Créer une nouvelle release avec l'archive ZIP vérifiée
          gh release create "$TAG" "$ZIP_PATH" \
            --title "Bulletins CNews Patrick - Dernière mise à jour" \
            --notes "Pack de bulletins météo CNews du $(date '+%d/%m/%Y à %Hh%M'). Contient les 32 bulletins vidéo validés et auto-vérifiés." \
            --latest
          echo "ZIP de production publié sur GitHub Releases avec succès."
